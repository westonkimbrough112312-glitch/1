import os
import subprocess
import pathlib
import blake3
from datetime import datetime

ROOT = pathlib.Path(__file__).resolve().parents[1]
LINEAGE = ROOT / "lineage"
LINEAGE.mkdir(exist_ok=True)

# Pull environment variables from GitHub Actions
ENV = {
    "GITHUB_RUN_ID": os.getenv("GITHUB_RUN_ID"),
    "GITHUB_SHA": os.getenv("GITHUB_SHA"),
    "GITHUB_REF": os.getenv("GITHUB_REF"),
    "GITHUB_ACTOR": os.getenv("GITHUB_ACTOR"),
    "GITHUB_REPOSITORY": os.getenv("GITHUB_REPOSITORY"),
    "GITHUB_WORKFLOW": os.getenv("GITHUB_WORKFLOW"),
    "QSol_Mode": os.getenv("QSOL_MODE", "production"),
    "QSol_Env": os.getenv("QSOL_ENV", "actions"),
}

def run_step(name, command):
    print(f"\n=== {name} ===")
    print(f"Command: {command}")
    result = subprocess.run(command, shell=True)
    if result.returncode != 0:
        raise SystemExit(f"Step failed: {name}")

def hash_repo():
    manifest = LINEAGE / "hash_manifest.txt"
    lines = []

    for p in ROOT.rglob("*"):
        if p.is_file() and ".git" not in str(p):
            h = blake3.blake3()
            with p.open("rb") as f:
                for chunk in iter(lambda: f.read(8192), b""):
                    h.update(chunk)
            lines.append(f"{h.hexdigest()}  {p.relative_to(ROOT)}")

    manifest.write_text("\n".join(sorted(lines)))
    print(f"Updated BLAKE3 manifest at {manifest}")

def zkp_verify():
    # Placeholder for real ZKP integration
    print("ZKP verification placeholder: all proofs assumed valid.")

def audit_report():
    report = LINEAGE / "audit_report.md"
    timestamp = datetime.utcnow().isoformat() + "Z"

    content = f"""# QSol AutoBot Audit Report

**Timestamp:** {timestamp}

## GitHub Environment
- Run ID: {ENV['GITHUB_RUN_ID']}
- Commit SHA: {ENV['GITHUB_SHA']}
- Branch/Ref: {ENV['GITHUB_REF']}
- Actor: {ENV['GITHUB_ACTOR']}
- Repository: {ENV['GITHUB_REPOSITORY']}
- Workflow: {ENV['GITHUB_WORKFLOW']}

## QSol Environment
- Mode: {ENV['QSol_Mode']}
- Environment: {ENV['QSol_Env']}

## Results
- Build: SUCCESS
- Tests: SUCCESS
- BLAKE3 manifest: updated
- ZKP verification: placeholder (SUCCESS)

Auto-generated by QSol AutoBot.
"""

    report.write_text(content)
    print(f"Audit report written to {report}")

def main():
    print("=== QSol AutoBot Starting ===")
    print("Environment variables detected:")
    for k, v in ENV.items():
        print(f"  {k}: {v}")

    run_step("Running tests", "python scripts/test.py")
    run_step("Running build", "python scripts/build.py")
    hash_repo()
    zkp_verify()
    audit_report()

    print("\nQSol AutoBot completed successfully.")

if __name__ == "__main__":
    main()
