name: QSol AutoBot

on:
  push:
    branches:
      - main

jobs:
  autobot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install blake3

      - run: python scripts/qsol_autobot.py

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "qsol-autobot"
          git config user.email "bot@qsol.llc"
          git add .
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "AutoBot: updated build artifacts"
          git push
