import os
import json
import base64
import pathlib
import secrets
from datetime import datetime

import blake3
from cryptography.hazmat.primitives.ciphers.aead import AESGCM

ROOT = pathlib.Path(__file__).resolve().parents[1]
LINEAGE = ROOT / "lineage"
LINEAGE.mkdir(exist_ok=True)

KEYS_DIR = LINEAGE / "qphone_keys"
KEYS_DIR.mkdir(exist_ok=True)

LOG_PATH = LINEAGE / "qphone_activity.log"


def log(msg: str) -> None:
    now = datetime.utcnow().isoformat(timespec="seconds") + "Z"
    line = f"[{now}] {msg}"
    print(line)
    with LOG_PATH.open("a", encoding="utf-8") as f:
        f.write(line + "\n")


def blake3_hex(data: bytes) -> str:
    h = blake3.blake3()
    h.update(data)
    return h.hexdigest()


def get_default_key_path() -> pathlib.Path:
    return KEYS_DIR / "qphone_default_key.json"


def generate_key() -> dict:
    """
    Generate a strong symmetric key for phone security.
    AES-GCM with 256-bit key, anchored with BLAKE3.
    """
    key_bytes = AESGCM.generate_key(bit_length=256)
    key_id = blake3_hex(key_bytes)[:32]

    key_record = {
        "key_id": key_id,
        "created_at": datetime.utcnow().isoformat(timespec="seconds") + "Z",
        "algorithm": "AES-256-GCM",
        "entropy_source": "secrets.token_bytes + AESGCM.generate_key",
        "key_b64": base64.b64encode(key_bytes).decode("ascii"),
    }

    return key_record


def save_key(key_record: dict, path: pathlib.Path | None = None) -> pathlib.Path:
    if path is None:
        path = get_default_key_path()

    tmp_path = path.with_suffix(".tmp")
    tmp_path.write_text(json.dumps(key_record, indent=2), encoding="utf-8")
    tmp_path.replace(path)

    log(f"Saved qphone key at {path} (key_id={key_record['key_id']})")
    return path


def load_key(path: pathlib.Path | None = None) -> dict:
    if path is None:
        path = get_default_key_path()
    if not path.exists():
        raise FileNotFoundError(f"No key found at {path}. Run 'init' first.")
    data = json.loads(path.read_text(encoding="utf-8"))
    return data


def encrypt_secret(plaintext: str, key_record: dict) -> dict:
    key_bytes = base64.b64decode(key_record["key_b64"])
    aesgcm = AESGCM(key_bytes)

    nonce = secrets.token_bytes(12)  # 96-bit nonce
    ct = aesgcm.encrypt(nonce, plaintext.encode("utf-8"), None)

    ciphertext_b64 = base64.b64encode(ct).decode("ascii")
    nonce_b64 = base64.b64encode(nonce).decode("ascii")

    record = {
        "version": 1,
        "algorithm": key_record["algorithm"],
        "key_id": key_record["key_id"],
        "nonce_b64": nonce_b64,
        "ciphertext_b64": ciphertext_b64,
        "created_at": datetime.utcnow().isoformat(timespec="seconds") + "Z",
        "plaintext_hash_b3": blake3_hex(plaintext.encode("utf-8")),
    }

    return record


def decrypt_secret(enc_record: dict, key_record: dict) -> str:
    key_bytes = base64.b64decode(key_record["key_b64"])
    aesgcm = AESGCM(key_bytes)

    nonce = base64.b64decode(enc_record["nonce_b64"])
    ciphertext = base64.b64decode(enc_record["ciphertext_b64"])

    plaintext_bytes = aesgcm.decrypt(nonce, ciphertext, None)
    plaintext = plaintext_bytes.decode("utf-8")

    # Optional integrity check via BLAKE3
    expected = enc_record.get("plaintext_hash_b3")
    if expected:
        actual = blake3_hex(plaintext_bytes)
        if actual != expected:
            raise ValueError("Integrity check failed: plaintext hash mismatch.")

    return plaintext


def cmd_init() -> None:
    """
    Initialize a default key for the phone.
    """
    log("qphone_guard: init")
    key_record = generate_key()
    path = save_key(key_record)
    print("\nQPhone Guard Key Created:")
    print(f"- Key ID: {key_record['key_id']}")
    print(f"- Path: {path}")
    print(f"- Algorithm: {key_record['algorithm']}")


def cmd_encrypt(secret: str) -> None:
    """
    Encrypt a secret using the default key.
    """
    log("qphone_guard: encrypt")
    key_record = load_key()
    enc_record = encrypt_secret(secret, key_record)

    # Print compact representation for copy/paste
    payload = base64.b64encode(json.dumps(enc_record).encode("utf-8")).decode("ascii")

    print("\nEncrypted Secret (QPhone Guard Payload):")
    print(payload)
    log(f"Encrypted secret with key_id={key_record['key_id']}")


def cmd_decrypt(payload: str) -> None:
    """
    Decrypt a secret previously produced by cmd_encrypt.
    """
    log("qphone_guard: decrypt")
    try:
        raw = base64.b64decode(payload)
        enc_record = json.loads(raw.decode("utf-8"))
    except Exception as exc:
        raise ValueError(f"Invalid payload format: {exc}")

    key_record = load_key()
    plaintext = decrypt_secret(enc_record, key_record)

    print("\nDecrypted Secret:")
    print(plaintext)
    log(f"Decrypted secret with key_id={key_record['key_id']}")


def usage() -> None:
    print(
        """
QPhone Guard — Quantum-Aware Phone Security Shell

Usage:
  python scripts/qphone_guard.py init
      Generate and store a new default key (AES-256-GCM, BLAKE3-anchored).

  python scripts/qphone_guard.py encrypt "my secret"
      Encrypt a secret string and print a compact payload.

  python scripts/qphone_guard.py decrypt "<payload>"
      Decrypt a payload produced by the 'encrypt' command.

Notes:
  - Keys are stored under: lineage/qphone_keys/
  - Activity is logged to: lineage/qphone_activity.log
  - This is symmetric encryption ready to be wrapped by a phone client or API.
"""
    )


def main(argv: list[str]) -> int:
    if len(argv) < 2:
        usage()
        return 1

    cmd = argv[1].lower()

    if cmd == "init":
        cmd_init()
        return 0
    elif cmd == "encrypt":
        if len(argv) < 3:
            print("Error: missing secret to encrypt.")
            return 1
        secret = argv[2]
        cmd_encrypt(secret)
        return 0
    elif cmd == "decrypt":
        if len(argv) < 3:
            print("Error: missing payload to decrypt.")
            return 1
        payload = argv[2]
        cmd_decrypt(payload)
        return 0
    else:
        usage()
        return 1


if __name__ == "__main__":
    raise SystemExit(main(os.sys.argv))python scripts/qphone_guard.py init
