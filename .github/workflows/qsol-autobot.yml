# ---------- Logging ----------

def log(msg: str) -> None:
    now = datetime.utcnow().isoformat(timespec="seconds") + "Z"
    print(f"[{now}] {msg}", flush=True)


def run_step(name: str, func) -> dict:
    """
    Run a Python function as a step, capture timing and errors.
    Returns a dict with {name, status, duration, error}.
    """
    log(f"=== STEP START: {name} ===")
    start = time.time()
    status = "SUCCESS"
    error = None

    try:
        func()
    except Exception as exc:
        status = "FAILED"
        error = str(exc)
        log(f"!!! STEP FAILED: {name} :: {exc}")
    finally:
        duration = time.time() - start
        log(f"=== STEP END: {name} (status={status}, duration={duration:.2f}s) ===")

    return {
        "name": name,
        "status": status,
        "duration": duration,
        "error": error,
    }

