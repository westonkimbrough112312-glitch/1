def step_audit_report(step_results: list) -> None:
    """
    Generate a markdown audit report summarizing the run.
    Includes environment, step results, and timestamps.
    """
    timestamp = datetime.utcnow().isoformat(timespec="seconds") + "Z"

    def fmt(val: str | None) -> str:
        return val if val is not None else "N/A"

    lines = []
    lines.append("# QSol AutoBot Audit Report")
    lines.append("")
    lines.append(f"**Timestamp:** {timestamp}")
    lines.append("")
    lines.append("## GitHub Environment")
    lines.append(f"- Run ID: `{fmt(ENV['GITHUB_RUN_ID'])}`")
    lines.append(f"- Commit SHA: `{fmt(ENV['GITHUB_SHA'])}`")
    lines.append(f"- Branch/Ref: `{fmt(ENV['GITHUB_REF'])}`")
    lines.append(f"- Actor: `{fmt(ENV['GITHUB_ACTOR'])}`")
    lines.append(f"- Repository: `{fmt(ENV['GITHUB_REPOSITORY'])}`")
    lines.append(f"- Workflow: `{fmt(ENV['GITHUB_WORKFLOW'])}`")
    lines.append("")
    lines.append("## QSol Environment")
    lines.append(f"- Mode: `{fmt(ENV['QSOL_MODE'])}`")
    lines.append(f"- Environment: `{fmt(ENV['QSOL_ENV'])}`")
    lines.append("")
    lines.append("## Step Results")

    overall_status = "SUCCESS"
    for r in step_results:
        name = r["name"]
        status = r["status"]
        duration = r["duration"]
        error = r["error"]

        if status != "SUCCESS":
            overall_status = "FAILED"

        lines.append(f"- **{name}**")
        lines.append(f"  - Status: `{status}`")
        lines.append(f"  - Duration: `{duration:.2f}s`")
        if error:
            lines.append(f"  - Error: `{error}`")

    lines.append("")
    lines.append(f"## Overall Status")
    lines.append(f"- `{overall_status}`")
    lines.append("")
    lines.append("> Auto-generated by QSol AutoBot.")

    AUDIT_REPORT_PATH.write_text("\n".join(lines))
    log(f"Audit report written to {AUDIT_REPORT_PATH}")

# ---------- Main orchestration ----------

def main() -> int:
    log("=== QSol AutoBot Starting ===")

    log("Environment snapshot:")
    for k, v in ENV.items():
        log(f"  {k} = {v}")

    step_results = []

    # Order of execution is your canonical pipeline
    step_results.append(run_step("Tests", step_tests))
    step_results.append(run_step("Build", step_build))
    step_results.append(run_step("Hash Repo (BLAKE3)", step_hash_repo))
    step_results.append(run_step("ZKP Verify", step_zkp_verify))
    step_results.append(run_step("Audit Report", lambda: step_audit_report(step_results)))

    # Determine overall success/failure
    failed_steps = [r for r in step_results if r["status"] != "SUCCESS"]
    if failed_steps:
        log("QSol AutoBot completed with FAILURES:")
        for r in failed_steps:
            log(f"  - {r['name']}: {r['error']}")
        return 1

    log("QSol AutoBot completed SUCCESSFULLY.")
    return 0


if __name__ == "__main__":
    sys.exit(main())
