def blake3_hash_file(path: pathlib.Path) -> str:
    h = blake3.blake3()
    with path.open("rb") as f:
        for chunk in iter(lambda: f.read(8192), b""):
            if not chunk:
                break
            h.update(chunk)
    return h.hexdigest()


def step_hash_repo() -> None:
    """
    Walk the repo and compute a BLAKE3 manifest of all files (excluding .git).
    Writes to lineage/hash_manifest.txt.
    """
    log(f"Computing BLAKE3 hash manifest under {ROOT}")
    lines = []

    for p in ROOT.rglob("*"):
        if p.is_file() and ".git" not in p.parts:
            digest = blake3_hash_file(p)
            rel = p.relative_to(ROOT)
            lines.append(f"{digest}  {rel}")

    HASH_MANIFEST_PATH.write_text("\n".join(sorted(lines)))
    log(f"Updated BLAKE3 manifest at {HASH_MANIFEST_PATH}")


